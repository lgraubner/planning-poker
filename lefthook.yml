# Formats staged files before each commit. CI still checks formatting for
# commits made without the hook. Install once: npx --prefix web lefthook install
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: '*.{ts,tsx,js,mjs,json,css,html,md,yml,yaml}'
      run: web/node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: gofmt
      glob: '*.go'
      run: gofmt -w {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: web/node_modules/.bin/commitlint --cwd web --edit {1}
