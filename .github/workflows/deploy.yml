name: Deploy

# Coolify's auto-deploy is off; this triggers it once CI and Docker both pass on main.
on:
  workflow_run:
    workflows: [CI, Docker]
    types: [completed]
    branches: [main]

permissions:
  actions: read

concurrency: deploy

jobs:
  deploy:
    name: Deploy to Coolify
    # A fork's pull request from a branch named main also matches the branch filter.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Coolify deploys the head of main, so only a run for that commit may deploy,
      # and only once both workflows have passed; a newer push deploys itself.
      - name: Trigger deploy webhook
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$SHA" ]; then
            echo "main has moved past $SHA; the newer commit deploys itself."
            exit 0
          fi
          for workflow in ci.yml docker.yml; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SHA" --jq '.workflow_runs[0].conclusion')
            if [ "$conclusion" != success ]; then
              echo "$workflow is ${conclusion:-not finished} for $SHA; waiting for it."
              exit 0
            fi
          done
          curl --fail --silent --show-error -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
