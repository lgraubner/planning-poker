name: Docker

# The image build is the slowest check and only breaks when its inputs change,
# so PRs run it only then. CI calls it on every push to main before deploying.
on:
  workflow_call:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - web/package.json
      - web/package-lock.json
      - scripts/container-smoke.sh
      - .github/workflows/docker.yml

permissions:
  contents: read

# A called workflow sees the caller's github.workflow, and sharing CI's group would deadlock.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: planning-poker:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run smoke test
        run: sh scripts/container-smoke.sh
